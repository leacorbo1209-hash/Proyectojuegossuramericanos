<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juegos Suramericanos Santa Fe 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">

            <button class="brand" id="btnInicio">
                <span>JUEGOS</span>
                <strong>SURAMERICANOS</strong>
            </button>

            <nav class="menu">

                <button class="menu-item active" id="btnFavoritos">
                    <span class="icon">⭐</span>
                    <span>Favoritos</span>
                </button>

                <button class="menu-item" id="btnEquipos">
                    <span class="icon">🏟️</span>
                    <span>Equipos</span>
                </button>

                <button class="menu-item" id="btnIndividuales">
    <span class="icon">🏃</span>
    <span>Individuales</span>
</button>

                <button class="menu-item" id="btnPaises">
    <span class="icon">🌎</span>
    <span>Países</span>
</button>



                <button class="menu-item" id="btnCalendario">
    <span class="icon">📅</span>
    <span>Calendario</span>
</button>

            </nav>

            <div class="sidebar-bottom">
                <button class="theme-button" id="themeButton">
                    <span id="themeIcon">🌙</span>
                    <span id="themeText">Modo oscuro</span>
                </button>
            </div>

        </aside>


        <!-- CONTENIDO PRINCIPAL -->
        <main class="main-content">
       
            <section id="seccionFavoritos" class="seccion-favoritos" hidden>
    <h2>⭐ Mis favoritos</h2>
    <p id="contadorFavoritos"></p>
    <div id="eventosFavoritos" class="eventos-live-grid"></div>
</section>
            <section id="seccionEquipos" class="seccion-favoritos" hidden>
    <h2>🏟️ Equipos</h2>
    <p id="contadorEquipos"></p>
    <div id="eventosEquipos" class="eventos-live-grid"></div>
</section>

            <section id="seccionIndividuales" class="seccion-favoritos" hidden>
    <h2>🏃 Individuales</h2>
    <p id="contadorIndividuales"></p>
    <div id="eventosIndividuales" class="eventos-live-grid"></div>
</section>
            <section id="seccionPaises" class="seccion-favoritos" hidden>
    <h2>🌎 Países</h2>
    <p id="contadorPaises"></p>
    <div id="eventosPaises" class="eventos-live-grid"></div>
</section>
            <section id="seccionCalendario" class="seccion-calendario" hidden>

    <header class="calendario-header">

        <div>
            <p class="eyebrow">JUEGOS SURAMERICANOS</p>
            <h1>Calendario</h1>
            <p id="contadorCalendario">
                Eventos de los Juegos Suramericanos
            </p>
        </div>

        <div class="calendario-controles">

            <button
                id="calendarioAnterior"
                class="calendario-nav"
                type="button"
            >
                ‹
            </button>

            <div class="calendario-fecha">
                <strong id="calendarioFechaTexto">
                    —
                </strong>

                <span id="calendarioFechaCompleta">
                    —
                </span>
            </div>

            <button
                id="calendarioSiguiente"
                class="calendario-nav"
                type="button"
            >
                ›
            </button>

        </div>

    </header>


    <div class="calendario-filtros">

        <button
            id="calendarioHoy"
            class="calendario-filtro activo"
            type="button"
        >
            HOY
        </button>

        <select id="calendarioDeporte">
            <option value="TODOS">
                Todos los deportes
            </option>
        </select>

    </div>


    <div
        id="calendarioEventos"
        class="calendario-eventos"
    ></div>

</section>

            <section id="seccionLive" class="seccion-live">

    <div class="seccion-live-header">

        <div>
            <h2>🔴 EN VIVO</h2>

            <p id="contadorLive">
                Eventos en vivo
            </p>
        </div>

    </div>

    <div
        id="eventosLive"
        class="eventos-live-grid"
    ></div>

</section>


        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
